<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 28px;
            color: #1a1a2e;
            margin-bottom: 24px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #4f46e5;
        }

        button.add-btn {
            padding: 12px 20px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.add-btn:hover {
            background: #4338ca;
        }

        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #f8f9ff;
            border-radius: 10px;
            border: 1px solid #e8e8f0;
            transition: all 0.2s;
        }

        .todo-item:hover {
            box-shadow: 0 2px 8px rgba(79,70,229,0.1);
        }

        .todo-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4f46e5;
        }

        .todo-title {
            flex: 1;
            font-size: 15px;
            color: #333;
            transition: all 0.2s;
        }

        .todo-title.done {
            text-decoration: line-through;
            color: #aaa;
        }

        button.delete-btn {
            background: none;
            border: none;
            color: #e53e3e;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        button.delete-btn:hover {
            background: #fff5f5;
        }

        .empty {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            padding: 20px;
        }

        .stats {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Todo App</h1>

        <div class="input-group">
            <input type="text" id="todoInput" placeholder="Yeni tapşırıq əlavə et..." />
            <button class="add-btn" onclick="addTodo()">Əlavə et</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>
        <p class="stats" id="stats"></p>
    </div>

    <script>
        const API = '/api/todos';

        async function loadTodos() {
            try {
                const res = await fetch(API);
                const todos = await res.json();
                renderTodos(todos);
            } catch (e) {
                console.error('Server ilə əlaqə yoxdur:', e);
            }
        }

        function renderTodos(todos) {
            const list = document.getElementById('todoList');
            const stats = document.getElementById('stats');

            if (todos.length === 0) {
                list.innerHTML = '<p class="empty">Heç bir tapşırıq yoxdur 🎉</p>';
                stats.textContent = '';
                return;
            }

            list.innerHTML = todos.map(todo => `
                <li class="todo-item">
                    <input type="checkbox" ${todo.completed ? 'checked' : ''}
                        onchange="toggleTodo(${todo.id})" />
                    <span class="todo-title ${todo.completed ? 'done' : ''}">${todo.title}</span>
                    <button class="delete-btn" onclick="deleteTodo(${todo.id})">🗑</button>
                </li>
            `).join('');

            const done = todos.filter(t => t.completed).length;
            stats.textContent = `${done} / ${todos.length} tamamlandı`;
        }

        async function addTodo() {
            const input = document.getElementById('todoInput');
            const title = input.value.trim();
            if (!title) return;

            await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });

            input.value = '';
            loadTodos();
        }

        async function toggleTodo(id) {
            await fetch(`${API}/${id}/toggle`, { method: 'PUT' });
            loadTodos();
        }

        async function deleteTodo(id) {
            await fetch(`${API}/${id}`, { method: 'DELETE' });
            loadTodos();
        }

        document.getElementById('todoInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') addTodo();
        });

        loadTodos();
    </script>
</body>
</html>
